name: email-send
description: "Block send_message tool for email targets unless a draft has been loaded and approved."
action: block
triggers:
  - tool_name: send_message
    args:
      target:
        operator: contains
        value: "@"
preconditions:
  - state_key: draft.email.loaded
    required: true
    message: "Email draft must be loaded before sending"
  - state_key: draft.email.approved
    required: true
    message: "Email draft must be approved before sending"
