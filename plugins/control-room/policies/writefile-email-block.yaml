# ABOUTME: Policy blocking write_file when content contains email-sending code.
# ABOUTME: Catches SMTP libs, Graph API mail endpoints, nodemailer, etc.
# ABOUTME: Prevents writing scripts that bypass the send_message email guard.
# ABOUTME: Uses never-set state key for unconditional blocking.
# ABOUTME: Part of Phase 4 email loophole closure (2026-05-22).
name: writefile-email-block
description: "Block writing files that contain email-sending code patterns"
action: block
triggers:
  - tool_name: write_file
    args:
      content:
        operator: regex
        value: "smtplib|SMTP\\(|nodemailer|sendgrid|mailgun|\\.sendmail\\(|sendMail|graph\\.microsoft\\.com.*(sendMail|messages)|/me/(sendMail|messages)|createTransport|smtp_connection"
preconditions:
  - state_key: email.terminal_send_override
    required: true
    message: "Files containing email-sending code cannot be written. To send email:\n1. Call send_message(target='email:recipient@example.com', message='your message')\n2. The system will prompt you to call email_load_draft to create a draft\n3. Call email_show_preview to review the draft\n4. The user will run /approve-email to approve\n5. Then call send_message again to send the approved draft"
