# ABOUTME: Policy blocking execute_code when code contains email-sending patterns.
# ABOUTME: Catches smtplib, sendgrid, mailgun, Graph API mail endpoints.
# ABOUTME: Prevents Python code execution that bypasses send_message guard.
# ABOUTME: Uses never-set state key for unconditional blocking.
# ABOUTME: Part of Phase 4 email loophole closure (2026-05-22).
name: execute-code-email-block
description: "Block Python code execution containing email-sending patterns"
action: block
triggers:
  - tool_name: execute_code
    args:
      code:
        operator: regex
        value: "smtplib|SMTP\\(|sendgrid|mailgun|\\.sendmail\\(|graph\\.microsoft\\.com.*(sendMail|messages)|/me/(sendMail|messages)"
preconditions:
  - state_key: email.terminal_send_override
    required: true
    message: "Email-sending code cannot be executed directly (smtplib, requests to mail APIs, etc.). To send email:\n1. Call send_message(target='email:recipient@example.com', message='your message')\n2. The system will prompt you to call email_load_draft to create a draft\n3. Call email_show_preview to review the draft\n4. The user will run /approve-email to approve\n5. Then call send_message again to send the approved draft"
